<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avrelle Jewellery</title>
    <style>
        section{
            padding: 60px 0;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- nav bar -->

    <nav class="navbar navbar-expand-md">
        <div class="container-xxl">
            <a href="#intro" class="navbar-brand">
                <span class="fw-bold text-secondary">
                    Avrelle Jewellery
                </span>
            </a>
            <!-- toogle button for mobile nav -->
             <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
             </button>

             <!-- navbar links -->
             <div class="collapse navbar-collapse justify-content-end align-center" id="main-nav">
                <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="shop.html">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
                </ul>
             </div>

        </div>
    </nav>

    <!-- main image and intro text-->
     <section id="intro">
        <div class="container-lg position-relative h-100">
            <div class="row justify-content-center align-items-center h-100">
                <div class="col-md-5 text-center text-md-start">
                    <h1>
                        <div class="display-2"> Avrelle Jewellery</div>
                    </h1>
                    <p class="lead my-4 text-muted fst-italic">Affordable Gold Plated Jewellery</p>
                    <a href="#pricing" class="btn btn-secondary btn-lg">Buy Now</a>
                </div>
                <div class="col-md-5 text-center d-md-block">
                    <img class="img-fluid"  src="assets/models.png" alt="Jewellery">
                </div>
            </div>
            <!-- Down arrow -->
             <div class="row">
                <div class="col-12 d-flex justify-content-center">
                    <div class="down-arrow">
                        <div class="arrow-container">
                            <a href="#our-purpose">
                                <img src= "assets/images/arrow.png" width="20"/>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
     </section>

     <section>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <!-- Slider main container -->
                    <div class="swiper">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide" id="slide-01"></div>
                        <div class="swiper-slide" id="slide-02"></div>
                        <div class="swiper-slide" id="slide-03"></div>
                    </div>

                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- If we need navigation buttons -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>
        </div>
     </section>


<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
